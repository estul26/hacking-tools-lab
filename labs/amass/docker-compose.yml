name: amass-lab

services:
  target:
    build:
      context: .
      dockerfile: target.Dockerfile
    ports:
      - "127.0.0.1:18098:8080"
    networks:
      amass_net:
        ipv4_address: 172.52.220.20

  scanner:
    build:
      context: .
      dockerfile: scanner.Dockerfile
    command: ["sleep", "infinity"]
    working_dir: /work
    volumes:
      - ./outputs:/work/outputs
      - ./fixtures:/work/fixtures:ro
      - ./scope:/work/scope:ro
      - ./wordlists:/work/wordlists:ro
    depends_on:
      - target
    networks:
      amass_net:
        ipv4_address: 172.52.220.10

networks:
  amass_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.52.220.0/24
