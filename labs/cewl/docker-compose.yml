name: cewl-lab

services:
  target:
    build:
      context: .
      dockerfile: target.Dockerfile
    ports:
      - "127.0.0.1:18104:8080"
    networks:
      cewl_net:
        ipv4_address: 172.58.80.20

  scanner:
    build:
      context: .
      dockerfile: scanner.Dockerfile
    command: ["sleep", "infinity"]
    working_dir: /work
    volumes:
      - ./outputs:/work/outputs
      - ./scope:/work/scope:ro
    depends_on:
      - target
    networks:
      cewl_net:
        ipv4_address: 172.58.80.10

networks:
  cewl_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.58.80.0/24
