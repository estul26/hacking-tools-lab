[global]
   server role = standalone server
   server string = Enum4linux-ng Local Lab
   netbios name = ENUM4LAB
   workgroup = WORKGROUP
   map to guest = never
   usershare allow guests = no
   server min protocol = SMB2
   log file = /var/log/samba/log.%m
   max log size = 1000
   disable spoolss = yes

[labshare]
   path = /srv/samba/labshare
   browseable = yes
   read only = no
   valid users = labuser auditor

[reports]
   path = /srv/samba/reports
   browseable = yes
   read only = yes
   valid users = labuser auditor
