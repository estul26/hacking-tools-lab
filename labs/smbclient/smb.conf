[global]
   server role = standalone server
   server string = Smbclient Local Lab
   workgroup = WORKGROUP
   map to guest = never
   usershare allow guests = no
   server min protocol = SMB2
   log file = /var/log/samba/log.%m
   max log size = 1000
   disable spoolss = yes

[labshare]
   path = /srv/samba/labshare
   browseable = yes
   read only = no
   valid users = labuser

[dropbox]
   path = /srv/samba/dropbox
   browseable = yes
   read only = no
   valid users = labuser
