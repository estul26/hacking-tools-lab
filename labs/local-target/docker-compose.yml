name: local-target-lab

services:
  local-target:
    build:
      context: .
      dockerfile: target.Dockerfile
    command: ["python", "/opt/lab/target_app.py"]
    ports:
      - "127.0.0.1:8088:8080"
      - "127.0.0.1:2222:2222"
      - "127.0.0.1:2525:2525"
      - "127.0.0.1:16379:6379"
      - "127.0.0.1:5300:5300/udp"
    networks:
      local_target_net:
        ipv4_address: 172.32.30.20

  toolbox:
    build:
      context: .
      dockerfile: toolbox.Dockerfile
    command: ["sleep", "infinity"]
    depends_on:
      - local-target
    networks:
      local_target_net:
        ipv4_address: 172.32.30.10

  traffic:
    build:
      context: .
      dockerfile: traffic.Dockerfile
    command: ["python", "/opt/lab/traffic_generator.py"]
    environment:
      TARGET_HOST: local-target
      TRAFFIC_INTERVAL_SECONDS: "5"
    depends_on:
      - local-target
    profiles:
      - traffic
    networks:
      local_target_net:
        ipv4_address: 172.32.30.30

networks:
  local_target_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.32.30.0/24
