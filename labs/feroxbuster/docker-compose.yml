name: feroxbuster-lab

services:
  target:
    build:
      context: .
      dockerfile: target.Dockerfile
    ports:
      - "127.0.0.1:18091:8080"
    networks:
      feroxbuster_net:
        ipv4_address: 172.45.150.20

  scanner:
    build:
      context: .
      dockerfile: scanner.Dockerfile
    command: ["sleep", "infinity"]
    working_dir: /work
    volumes:
      - ./outputs:/work/outputs
      - ./wordlists:/work/wordlists:ro
    depends_on:
      - target
    networks:
      feroxbuster_net:
        ipv4_address: 172.45.150.10

networks:
  feroxbuster_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.45.150.0/24
