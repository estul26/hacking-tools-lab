name: nmap-lab

services:
  scanner:
    build:
      context: .
      dockerfile: scanner.Dockerfile
    command: ["sleep", "infinity"]
    working_dir: /work
    volumes:
      - ./scans:/work/scans
    depends_on:
      - target-web
      - target-services
    networks:
      nmap_net:
        ipv4_address: 172.30.10.10

  target-web:
    build:
      context: .
      dockerfile: target.Dockerfile
    command: ["python", "/opt/lab/lab_target.py", "web"]
    ports:
      - "127.0.0.1:8081:80"
    networks:
      nmap_net:
        ipv4_address: 172.30.10.20

  target-services:
    build:
      context: .
      dockerfile: target.Dockerfile
    command: ["python", "/opt/lab/lab_target.py", "services"]
    ports:
      - "127.0.0.1:12222:2222"
      - "127.0.0.1:12525:2525"
      - "127.0.0.1:16380:6379"
      - "127.0.0.1:8001:8000"
      - "127.0.0.1:15353:5353/udp"
    networks:
      nmap_net:
        ipv4_address: 172.30.10.30

networks:
  nmap_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.10.0/24
