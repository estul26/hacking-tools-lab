name: gau-lab

services:
  target:
    build:
      context: .
      dockerfile: target.Dockerfile
    ports:
      - "127.0.0.1:18101:8080"
    networks:
      gau_net:
        ipv4_address: 172.55.250.20

  scanner:
    build:
      context: .
      dockerfile: scanner.Dockerfile
    command: ["sleep", "infinity"]
    working_dir: /work
    volumes:
      - ./outputs:/work/outputs
      - ./fixtures:/work/fixtures:ro
      - ./scope:/work/scope:ro
    depends_on:
      - target
    networks:
      gau_net:
        ipv4_address: 172.55.250.10

networks:
  gau_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.55.250.0/24
